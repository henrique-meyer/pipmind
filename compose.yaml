services:
  landing:
    build:
      context: .
      args:
        BUILD_SHA: development
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
