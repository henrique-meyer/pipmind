name: Publish landing image
on:
  push:
    branches: [main]
    paths: [app/**, web/**, assets/**, Dockerfile, .dockerignore, pyproject.toml, uv.lock, scripts/smoke.py, .github/workflows/publish.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build and check release image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --build-arg BUILD_SHA="$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" .
          docker run -d --name pipmind-release --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 "$IMAGE:$GITHUB_SHA"
          python3 scripts/smoke.py --url http://127.0.0.1:8080 --build "$GITHUB_SHA"
      - name: Publish immutable source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
      - name: Clean up
        if: always()
        run: |
          docker rm -f pipmind-release || true
          docker logout ghcr.io
