name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Let an active main release finish; newer pushes must not interrupt Azure deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  landing_changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect public-site changes
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/landing-changes.sh
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Lint and format
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58 sh -c 'uv sync --locked --all-extras && uv run --locked --all-extras ruff check . && uv run --locked --all-extras ruff format --check .'
      - name: Test contracts, replay, graders and archive rejection offline
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" --env PIPMIND_SOURCE_SHA="$GITHUB_SHA" --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp -v "$PWD:/workspace" -w /workspace ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58 .venv/bin/python -m pytest -q
      - name: Replay fixture week and gate baseline coverage offline
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" --env PIPMIND_SOURCE_SHA="$GITHUB_SHA" --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp -v "$PWD:/workspace" -w /workspace ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58 .venv/bin/python -m pipmind.replay run --ci --output .data/replay-ci
      - name: Summarize replay outcomes and deferred coverage
        if: always() && hashFiles('.data/replay-ci/summary.json') != ''
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" --env PIPMIND_SOURCE_SHA="$GITHUB_SHA" --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp -v "$PWD:/workspace" -w /workspace ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58 .venv/bin/python -m pipmind.summary .data/replay-ci/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save sanitized replay summary only
        if: always() && hashFiles('.data/replay-ci/summary.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m1-replay-summary
          path: .data/replay-ci/summary.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Compile infrastructure
        run: |
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"
          az bicep build --file infra/domain.bicep --outfile "$RUNNER_TEMP/domain.json"
          az bicep build --file infra/shadow-foundation.bicep --outfile "$RUNNER_TEMP/shadow-foundation.json"
          az bicep build --file infra/shadow-app.bicep --outfile "$RUNNER_TEMP/shadow-app.json"
      - name: Verify browser analytics and landing release gates offline
        run: node --test tests/analytics.test.mjs tests/landing-release.test.mjs
      - name: Build and exercise isolated dry gateway container
        run: |
          docker build --target gateway -t pipmind-gateway:ci .
          python3 scripts/gateway_smoke.py
      - name: Build and exercise isolated information feed container
        run: |
          docker build --target feeds -t pipmind-feeds:ci .
          python3 scripts/feeds_smoke.py
      - name: Build and exercise shadow with real SQL Server and full-text search
        run: |
          docker build -f infra/sql.Dockerfile -t pipmind-sql:local .
          docker build --target shadow -t pipmind-shadow:ci .
          python3 scripts/shadow_smoke.py
      - name: Save bounded synthetic SQL shadow summary only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m4-shadow-summary
          path: .data/shadow-ci/summary.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
      - name: Build and exercise actual container
        run: |
          docker build --build-arg BUILD_SHA="$GITHUB_SHA" -t pipmind:ci .
          docker run -d --name pipmind-ci --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 pipmind:ci
          python3 scripts/smoke.py --url http://127.0.0.1:8080 --build "$GITHUB_SHA"
          docker run -d --name pipmind-analytics-ci --read-only --cap-drop ALL --security-opt no-new-privileges -e GOOGLE_ANALYTICS_ID=G-TEST123456 -e PUBLIC_SITE_URL=https://site.example -p 127.0.0.1:8083:8080 pipmind:ci
          python3 scripts/smoke.py --url http://127.0.0.1:8083 --build "$GITHUB_SHA" --analytics-id G-TEST123456 --site-url https://site.example
      - name: Remove test container
        if: always()
        run: docker rm -f pipmind-ci pipmind-analytics-ci || true
  publish_landing:
    needs: [checks, landing_changes]
    if: needs.landing_changes.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      source_sha: ${{ github.sha }}
  deploy_landing:
    needs: [checks, landing_changes, publish_landing]
    if: needs.landing_changes.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit
