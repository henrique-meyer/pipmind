[project]
name = "pipmind"
version = "0.1.0"
description = "PipMind landing page and offline replay foundation; trading in development"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
gateway = ["jsonschema>=4.23,<5", "lightstreamer-client-lib==2.2.3"]
feeds = ["jsonschema>=4.23,<5", "defusedxml>=0.7,<1"]
shadow = [
    "tzdata>=2025.2,<2028",
    "jsonschema>=4.23,<5",
    "defusedxml>=0.7,<1",
    "agent-framework-foundry==1.15.0",
    "azure-identity==1.26.0",
    "python-tds==1.17.1",
    "service-identity==26.1.0",
    "pyOpenSSL==26.4.0",
]

[dependency-groups]
dev = [
    "tzdata>=2025.2,<2028",
    "defusedxml>=0.7,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
